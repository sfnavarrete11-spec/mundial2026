<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elecciones del Cuadro (Admin) - Polla Mundial 2026</title>
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg: #0d0f12;
      --bg2: #14181c;
      --bg3: #1e2329;
      --border: #2a3139;
      --border2: #3f4752;
      --text: #eaeaea;
      --muted: #8892b0;
      --muted2: #a8b2d1;
      --gold: #f3ba2f;
      --gold-hover: #db9a1a;
      --error: #f6465d;
      --success: #0ecb81;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; display: flex; justify-content: center; }
    
    .container { width: 100%; max-width: 1000px; }
    
    header { margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .title h1 { font-size: 1.8rem; color: #fff; }
    .title h1 span { color: var(--gold); }
    .title p { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
    
    /* Botones */
    .btn { background: var(--bg3); border: 1px solid var(--border2); color: var(--text); padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; transition: all 0.2s ease; }
    .btn:hover { background: var(--border); border-color: var(--muted); }
    .btn-gold { background: var(--gold); color: #000; border: none; }
    .btn-gold:hover { background: var(--gold-hover); color: #000; }
    
    /* Configuración de Credenciales */
    .config-box { background: var(--bg2); border: 1px solid var(--border); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; }
    .config-box h3 { margin-bottom: 1rem; font-size: 1.1rem; color: var(--gold); }
    .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .input-group label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    .input-group input { background: var(--bg); border: 1px solid var(--border); padding: 0.6rem; border-radius: 6px; color: #fff; font-size: 0.9rem; }
    .input-group input:focus { border-color: var(--gold); outline: none; }

    /* Secciones del Dashboard */
    .dash-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 2rem; overflow: hidden; }
    .dash-section-title { background: var(--bg3); padding: 1rem 1.5rem; font-weight: 700; font-size: 1.1rem; border-bottom: 1px solid var(--border); color: #fff; border-left: 4px solid var(--gold); }
    
    /* Tablas */
    .users-table { display: flex; flex-direction: column; }
    .users-row { display: grid; grid-template-columns: 1fr 2.5fr; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); align-items: start; gap: 1.5rem; }
    .users-row:last-child { border-bottom: none; }
    .users-row.header { background: rgba(255,255,255,0.02); font-weight: 600; color: var(--muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; padding: 0.6rem 1.5rem; }
    
    /* Chips de Países */
    .team-chip { background: var(--bg3); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border2); display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; margin: 2px; }
    .team-chip strong { color: var(--gold); font-size: 0.78rem; }
    .team-chip .team-name { color: var(--muted2); font-size: 0.75rem; }
    
    /* Estados */
    .loader { padding: 3rem; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { padding: 1.5rem; text-align: center; color: var(--muted); font-style: italic; font-size: 0.9rem; }
    .error-msg { background: rgba(246, 70, 93, 0.1); border: 1px solid var(--error); color: var(--error); padding: 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
    .success-msg { background: rgba(14, 203, 129, 0.1); border: 1px solid var(--success); color: var(--success); padding: 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; text-align: center; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title">
        <h1>Control de Elecciones del <span>Cuadro</span></h1>
        <p>Panel de Administración y descarga de predicciones (Fase Decisiva)</p>
      </div>
      <div>
        <button id="btn-download" class="btn btn-gold hidden" onclick="downloadCSV()">
          📥 Descargar reporte en Excel (.CSV)
        </button>
      </div>
    </header>

    <!-- Caja de Configuración de Supabase -->
    <div class="config-box" id="config-box">
      <h3>🔌 Conexión con Supabase</h3>
      <p style="font-size:0.85rem; color:var(--muted); margin-bottom:1rem;">Ingresa las credenciales de tu proyecto para autenticar la consulta directa.</p>
      <div class="grid-inputs">
        <div class="input-group">
          <label for="sup-url">SUPABASE_URL</label>
          <input type="text" id="sup-url" placeholder="https://xyzcompany.supabase.co">
        </div>
        <div class="input-group">
          <label for="sup-key">SUPABASE_ANON_KEY (o Service Role Key)</label>
          <input type="password" id="sup-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
        </div>
      </div>
      <button class="btn" style="width:100%; justify-content:center; background:var(--gold); color:#000; border:none;" onclick="initSupabase()">Conectar y Cargar Datos</button>
    </div>

    <!-- Contenedor de Mensajes de Error/Éxito -->
    <div id="msg-container"></div>

    <!-- Contenedor Principal donde se renderizarán las tablas -->
    <div id="admin-bracket-picks-content">
      <div class="empty">Introduce tus credenciales de Supabase arriba para renderizar las elecciones del cuadro.</div>
    </div>
  </div>

  <script>
    let supabaseClient = null;
    let globalUsers = [];
    let globalPicks = [];
    
    const roundLabels = {
      'R16': 'Octavos de Final',
      'QF': 'Cuartos de Final',
      'SF': 'Semifinales',
      'F': 'Final'
    };

    // Auto-completar credenciales si ya se usaron antes en este navegador
    document.addEventListener("DOMContentLoaded", () => {
      const savedUrl = localStorage.getItem('admin_sup_url');
      const savedKey = localStorage.getItem('admin_sup_key');
      if(savedUrl) document.getElementById('sup-url').value = savedUrl;
      if(savedKey) document.getElementById('sup-key').value = savedKey;
    });

    // Inicializa el cliente de Supabase
    async function initSupabase() {
      const url = document.getElementById('sup-url').value.trim();
      const key = document.getElementById('sup-key').value.trim();
      const msgContainer = document.getElementById('msg-container');
      
      msgContainer.innerHTML = '';

      if (!url || !key) {
        msgContainer.innerHTML = `<div class="error-msg">Por favor, rellena ambos campos de credenciales.</div>`;
        return;
      }

      try {
        // Guardar credenciales para comodidad del administrador
        localStorage.setItem('admin_sup_url', url);
        localStorage.setItem('admin_sup_key', key);

        supabaseClient = supabase.createClient(url, key);
        
        // Colocar cargador visual
        document.getElementById('admin-bracket-picks-content').innerHTML = `
          <div class="loader"><div class="spinner"></div>Consultando base de datos en tiempo real...</div>
        `;

        await loadAndRenderData();

      } catch (err) {
        msgContainer.innerHTML = `<div class="error-msg">Error de inicialización: ${err.message}</div>`;
      }
    }

    // Consulta las tablas correspondientes y pinta la interfaz
    async function loadAndRenderData() {
      try {
        // 1. Consultar usuarios ordenados alfabéticamente
        const { data: users, error: uErr } = await supabaseClient.from('users').select('id, name, email').order('name');
        if (uErr) throw uErr;

        // 2. Consultar predicciones del cuadro eliminatorio
        const { data: kPicks, error: kErr } = await supabaseClient.from('knockout_predictions').select('*');
        if (kErr) throw kErr;

        // Guardar en variables globales para la posterior exportación a CSV
        globalUsers = users || [];
        globalPicks = kPicks || [];

        if (globalUsers.length === 0) {
          document.getElementById('admin-bracket-picks-content').innerHTML = '<div class="empty">No se encontraron participantes registrados en la tabla "users".</div>';
          document.getElementById('btn-download').classList.add('hidden');
          return;
        }

        // Estructurar mapa: [user_id][round_key] => Array de equipos elegidos
        const userPicksMap = {};
        globalUsers.forEach(u => { 
          userPicksMap[u.id] = { 'R16': [], 'QF': [], 'SF': [], 'F': [] }; 
        });

        globalPicks.forEach(pick => {
          if (userPicksMap[pick.user_id] && userPicksMap[pick.user_id][pick.round_key]) {
            userPicksMap[pick.user_id][pick.round_key].push({
              code: pick.predicted_team_code,
              name: pick.predicted_team_name,
              flag: pick.predicted_team_flag || '🏳️'
            });
          }
        });

        // Construcción del HTML dinámico segmentado por rondas del cuadro
        let html = '';
        const roundsKeys = ['R16', 'QF', 'SF', 'F'];

        roundsKeys.forEach(rKey => {
          html += `
            <div class="dash-section">
              <div class="dash-section-title">${roundLabels[rKey]} (${rKey})</div>
              <div class="users-table">
                <div class="users-row header">
                  <div>Participante</div>
                  <div>Equipos Seleccionados en esta Ronda</div>
                </div>
          `;

          globalUsers.forEach(u => {
            const picks = userPicksMap[u.id][rKey] || [];
            let picksHtml = '';
            
            if (picks.length > 0) {
              picksHtml = picks.map(p => `
                <span class="team-chip">
                  <span>${p.flag}</span>
                  <strong>${p.code}</strong>
                  <span class="team-name">${p.name}</span>
                </span>
              `).join(' ');
            } else {
              picksHtml = `<span style="color: var(--muted); font-style: italic; font-size: 0.85rem;">Sin elecciones confirmadas</span>`;
            }

            html += `
              <div class="users-row">
                <div>
                  <strong style="color: #fff; font-size: 0.95rem;">${u.name || 'Sin Nombre'}</strong>
                  <div style="font-size: 0.75rem; color: var(--muted); margin-top:2px;">${u.email}</div>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                  ${picksHtml}
                </div>
              </div>
            `;
          });

          html += `</div></div>`;
        });

        document.getElementById('admin-bracket-picks-content').innerHTML = html;
        
        // Mostrar el botón de descarga si todo se procesó correctamente
        document.getElementById('btn-download').classList.remove('hidden');
        document.getElementById('msg-container').innerHTML = `<div class="success-msg">✅ Datos cargados correctamente. Se encontraron ${globalPicks.length} predicciones guardadas.</div>`;

      } catch (error) {
        document.getElementById('msg-container').innerHTML = `<div class="error-msg">Error en base de datos: ${error.message}</div>`;
        document.getElementById('admin-bracket-picks-content').innerHTML = `<div class="empty" style="color:var(--error)">No se pudieron renderizar las tablas debido al error anterior.</div>`;
        document.getElementById('btn-download').classList.add('hidden');
      }
    }

    // Función para procesar y exportar la información limpia a formato CSV (Excel)
    function downloadCSV() {
      if (globalUsers.length === 0) return;

      // Definir las cabeceras del archivo
      let csvRows = ['"ID Usuario","Nombre","Email","Ronda","Codigo Equipo","Nombre Equipo"'];

      // Mapear los datos de cada predicción con la información de su respectivo usuario
      globalPicks.forEach(pick => {
        const user = globalUsers.find(u => u.id === pick.user_id);
        const userName = user ? (user.name || 'Sin Nombre') : 'Desconocido';
        const userEmail = user ? user.email : 'Desconocido';
        const roundName = roundLabels[pick.round_key] || pick.round_key;
        
        // Escapar comillas dobles para evitar corrupciones en strings de Excel
        const cleanName = userName.replace(/"/g, '""');
        const cleanTeamName = pick.predicted_team_name.replace(/"/g, '""');

        csvRows.push(`"${pick.user_id}","${cleanName}","${userEmail}","${roundName}","${pick.predicted_team_code}","${cleanTeamName}"`);
      });

      // Crear el archivo con codificación UTF-8 BOM para soporte completo de tildes y caracteres en Excel
      const csvContent = "\uFEFF" + csvRows.join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      // Lanzar la descarga nativa en el navegador
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Predicciones_Cuadro_Mundial2026_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
